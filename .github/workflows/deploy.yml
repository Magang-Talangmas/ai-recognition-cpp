name: CD — Deploy AI Engine (Detection, Recognition & Stream)

on:
  push:
    branches:
      - feat/recognition-fusion
      - feat/recognition-face
      - gpu-migration
      - stream
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Pop!_OS Server
    runs-on: self-hosted

    steps:
      - name: Deploy Sesuai Branch yang Di-push
        run: |
          set -e
          export PATH=$PATH:/usr/local/bin:/usr/bin:/bin

          echo "=========================================================="
          echo "  Deploying Branch: ${{ github.ref_name }}"
          echo "=========================================================="

          # ------------------------------------------------------------
          # KASUS 1: Branch Recognition (feat/recognition-fusion / feat/recognition-face)
          # ------------------------------------------------------------
          if [ "${{ github.ref_name }}" = "feat/recognition-fusion" ] || [ "${{ github.ref_name }}" = "feat/recognition-face" ]; then
            echo "[1/3] Masuk ke direktori ai-recognition..."
            cd /home/popos/projek-anakmagang/ai-recognition
            
            echo "[2/3] Menarik kode terbaru dari GitHub branch ${{ github.ref_name }}..."
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            
            echo "[3/4] Membuat virtualenv dan menginstal dependensi..."
            python3 -m venv .venv
            .venv/bin/python -m pip install --upgrade pip
            .venv/bin/python -m pip install -r requirements.txt

            echo "[4/4] Pindah dari Docker ke PM2..."
            mkdir -p logs

            docker stop \
              projek-anakmagang-ai-mobile-api \
              projek-anakmagang-ai-recognition-worker \
              || true

            if ! pm2 startOrReload ecosystem.config.js --update-env; then
              echo "PM2 gagal start; menjalankan kembali container lama."
              docker start \
                projek-anakmagang-ai-mobile-api \
                projek-anakmagang-ai-recognition-worker \
                || true
              exit 1
            fi

            # recognition.py memuat model InsightFace saat startup dan akan berhenti
            # bila CUDAExecutionProvider tidak aktif. Beri waktu agar PM2 menangkap crash.
            sleep 10
            pm2 jlist | python3 -c '
import json, sys
apps = {app["name"]: app["pm2_env"]["status"] for app in json.load(sys.stdin)}
for name in ("ai-mobile-api", "ai-recognition-worker"):
    if apps.get(name) != "online":
        raise SystemExit(f"{name} tidak online setelah deployment: {apps.get(name)!r}")
print("PM2 health check passed; recognition worker online.")
'

            pm2 save
            
            echo "DEPLOY SUKSES: ai-recognition (${{ github.ref_name }}) sudah ter-update!"

          # ------------------------------------------------------------
          # KASUS 2: Branch gpu-migration (Modul Deteksi Wajah CCTV)
          # ------------------------------------------------------------
          elif [ "${{ github.ref_name }}" = "gpu-migration" ]; then
            echo "[1/3] Masuk ke direktori ai-detection..."
            cd /home/popos/projek-anakmagang/ai-detection
            
            echo "[2/3] Menarik kode terbaru dari GitHub..."
            git fetch origin gpu-migration
            git reset --hard origin/gpu-migration
            
            echo "[3/3] Rebuild & Restart Docker Container (FastAPI Port 8000)..."
            docker compose up -d --build
            
            echo "DEPLOY SUKSES: ai-detection sudah ter-update!"

          # ------------------------------------------------------------
          # KASUS 3: Branch stream (Penyalur Siaran CCTV ke MediaMTX)
          # ------------------------------------------------------------
          elif [ "${{ github.ref_name }}" = "stream" ]; then
            echo "[1/3] Masuk ke direktori ai-stream..."
            cd /home/popos/projek-anakmagang/ai-stream
            
            echo "[2/3] Menarik kode terbaru dari GitHub..."
            git fetch origin stream
            git reset --hard origin/stream
            
            echo "[3/3] Restart PM2 ai-stream-publisher..."
            pm2 restart ai-stream-publisher || pm2 start "python3 publisher.py" --name ai-stream-publisher
            pm2 save
            
            echo "DEPLOY SUKSES: ai-stream-publisher sudah ter-update!"

          else
            echo "Branch ${{ github.ref_name }} tidak memiliki konfigurasi auto-deploy."
          fi

          echo "=========================================================="
          echo "  Deployment Selesai dengan Sukses!"
          echo "=========================================================="
