name: CD — Deploy AI Engine (Detection, Recognition & Stream)

on:
  push:
    branches:
      - feat/recognition-fusion
      - feat/recognition-face
      - gpu-migration
      - stream
  workflow_dispatch:

concurrency:
  group: ai-engine-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Pop!_OS Server
    runs-on: self-hosted

    steps:
      - name: Deploy Sesuai Branch yang Di-push
        run: |
          set -e
          export PATH=$PATH:/usr/local/bin:/usr/bin:/bin

          echo "=========================================================="
          echo "  Deploying Branch: ${{ github.ref_name }}"
          echo "=========================================================="

          # ------------------------------------------------------------
          # KASUS 1: Branch Recognition (feat/recognition-fusion / feat/recognition-face)
          # ------------------------------------------------------------
          if [ "${{ github.ref_name }}" = "feat/recognition-fusion" ] || [ "${{ github.ref_name }}" = "feat/recognition-face" ]; then
            echo "[1/3] Masuk ke direktori ai-recognition..."
            cd /home/popos/projek-anakmagang/ai-recognition
            
            echo "[2/3] Menarik kode terbaru dari GitHub branch ${{ github.ref_name }}..."
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            
            echo "[3/3] Rebuild & Restart Docker Container (Mobile API & Recognition Worker)..."
            docker compose up -d --build
            
            echo "DEPLOY SUKSES: ai-recognition (${{ github.ref_name }}) sudah ter-update!"

          # ------------------------------------------------------------
          # KASUS 2: Branch gpu-migration (Modul Deteksi Wajah CCTV)
          # ------------------------------------------------------------
          elif [ "${{ github.ref_name }}" = "gpu-migration" ]; then
            echo "[1/3] Masuk ke direktori ai-detection..."
            cd /home/popos/projek-anakmagang/ai-detection
            
            echo "[2/3] Menarik kode terbaru dari GitHub..."
            git fetch origin gpu-migration
            git reset --hard origin/gpu-migration
            
            echo "[3/3] Build C++, siapkan virtualenv, lalu handover ke PM2..."
            export PATH=$PATH:~/.local/bin

            rollback() {
              echo "PM2 detection gagal. Mengembalikan container detection lama..."
              pm2 delete ai-detection-api || true
              pm2 delete ai-detection-supervisor || true
              docker start projek-anakmagang-ai-detection || true
              curl -fsS --max-time 10 http://127.0.0.1:8000/health || true
              exit 1
            }

            # Semua persiapan dilakukan saat container lama masih melayani port 8000.
            python3 -m venv .venv
            .venv/bin/python -m pip install --upgrade pip
            .venv/bin/python -m pip install -r requirements.txt
            
            # Bila dependency C++ belum lengkap, gagal di sini tanpa mengganggu Docker lama.
            cmake -B build -S .
            cmake --build build --config Release -j$(nproc)

            test -x build/face_preprocessor || {
              echo "Binary Linux build/face_preprocessor tidak ditemukan."
              exit 1
            }

            # Handover hanya dilakukan setelah build sukses.
            docker stop projek-anakmagang-ai-detection || rollback
            pm2 startOrReload ecosystem.config.js --update-env || rollback
            sleep 3

            curl -fsS --max-time 10 http://127.0.0.1:8000/health || rollback
            pm2 describe ai-detection-api | grep -q 'status.*online' || rollback
            pm2 describe ai-detection-supervisor | grep -q 'status.*online' || rollback
            pm2 save
            
            echo "DEPLOY SUKSES: ai-detection sudah ter-update!"

          # ------------------------------------------------------------
          # KASUS 3: Branch stream (Penyalur Siaran CCTV ke MediaMTX)
          # ------------------------------------------------------------
          elif [ "${{ github.ref_name }}" = "stream" ]; then
            echo "[1/3] Masuk ke direktori ai-stream..."
            cd /home/popos/projek-anakmagang/ai-stream
            
            echo "[2/3] Menarik kode terbaru dari GitHub..."
            git fetch origin stream
            git reset --hard origin/stream
            
            echo "Stream dikelola oleh workflow CI/CD khusus stream. Tidak ada aksi dari workflow ini."

          else
            echo "Branch ${{ github.ref_name }} tidak memiliki konfigurasi auto-deploy."
          fi

          echo "=========================================================="
          echo "  Deployment Selesai dengan Sukses!"
          echo "=========================================================="
