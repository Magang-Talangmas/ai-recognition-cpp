name: CI — AI Engine

on:
  pull_request:
    branches: [gpu-migration, feat/recognition-fusion, stream]
  push:
    branches: [gpu-migration, feat/recognition-fusion, stream]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Python and container configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Check Python syntax
        run: python -m compileall -q -x '(venv|\\.venv|__pycache__)' .

      - name: Validate Docker Compose
        if: ${{ hashFiles('docker-compose.yml') != '' }}
        run: |
          cp .env.example .env
          docker compose config -q

      - name: Build application image
        if: ${{ hashFiles('Dockerfile') != '' }}
        run: docker build --pull --tag ai-engine-ci:${{ github.sha }} .

      - name: Resolve Python dependencies
        if: ${{ hashFiles('Dockerfile') == '' }}
        run: python -m pip install --dry-run -r requirements.txt
