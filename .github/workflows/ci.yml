name: CI — AI Engine

on:
  pull_request:
    branches: [gpu-migration, feat/recognition-fusion, stream]
  push:
    branches: [gpu-migration, feat/recognition-fusion, stream]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Python and container configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Check Python syntax
        run: python -m compileall -q -x '(venv|\\.venv|__pycache__)' .

      - name: Validate Docker Compose
        if: ${{ hashFiles('docker-compose.yml') != '' && hashFiles('.env.example') != '' }}
        run: |
          cp .env.example .env
          docker compose config -q

      - name: Build application image
        if: ${{ hashFiles('Dockerfile') != '' }}
        run: docker build --pull --tag ai-engine-ci:${{ github.sha }} .

      - name: Resolve Python dependencies
        if: ${{ hashFiles('Dockerfile') == '' }}
        run: python -m pip install --dry-run -r requirements.txt

  build-detection:
    name: Build C++ detection on AI runner
    needs: validate
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/gpu-migration') ||
      (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'gpu-migration')
    runs-on: [self-hosted, Linux, X64, ai-ml]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure and build face preprocessor
        run: |
          set -e
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j2
          test -x build/face_preprocessor

  deploy-detection:
    name: Deploy GPU detection to Pop!_OS
    needs: build-detection
    if: github.event_name == 'push' && github.ref == 'refs/heads/gpu-migration'
    runs-on: [self-hosted, Linux, X64, ai-ml]
    concurrency:
      group: ai-detection-deploy
      cancel-in-progress: false

    steps:
      - name: Deploy validated GPU detection build
        run: |
          set -e
          export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:/home/popos/.local/bin
          cd /home/popos/projek-anakmagang/ai-detection
          git fetch origin gpu-migration
          git reset --hard origin/gpu-migration

          rollback() {
            echo "PM2 detection gagal. Mengembalikan container detection lama..."
            pm2 delete ai-detection-api || true
            pm2 delete ai-detection-supervisor || true
            docker start projek-anakmagang-ai-detection || true
            curl -fsS --max-time 10 http://127.0.0.1:8000/health || true
            exit 1
          }

          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j$(nproc)
          test -x build/face_preprocessor

          docker stop projek-anakmagang-ai-detection || rollback
          pm2 startOrReload ecosystem.config.js --update-env || rollback
          sleep 3

          curl -fsS --max-time 10 http://127.0.0.1:8000/health || rollback
          pm2 describe ai-detection-api | grep -q 'status.*online' || rollback
          pm2 describe ai-detection-supervisor | grep -q 'status.*online' || rollback
          pm2 save
