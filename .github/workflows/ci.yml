name: CI — AI Engine

on:
  pull_request:
    branches: [gpu-migration, feat/recognition-fusion, stream]
  push:
    branches: [gpu-migration, feat/recognition-fusion, stream]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Python and container configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Check Python syntax
        run: python -m compileall -q -x '(venv|\\.venv|__pycache__)' .

      - name: Validate Docker Compose
        if: ${{ hashFiles('docker-compose.yml') != '' }}
        run: |
          cp .env.example .env
          docker compose config -q

      - name: Build application image
        if: ${{ hashFiles('Dockerfile') != '' }}
        run: docker build --pull --tag ai-engine-ci:${{ github.sha }} .

      - name: Resolve Python dependencies
        if: ${{ hashFiles('Dockerfile') == '' }}
        run: |
          # GitHub-hosted runners have no CUDA runtime and their package index
          # does not currently carry the server's ORT 1.26 wheel. CUDA itself is
          # verified by the deploy job on the Pop!_OS runner.
          grep -Eq '^onnxruntime-gpu==' requirements.txt
          grep -v '^onnxruntime-gpu' requirements.txt > /tmp/requirements-ci.txt
          python -m pip install --dry-run -r /tmp/requirements-ci.txt

  deploy_fusion:
    name: Deploy Fusion after validation
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/recognition-fusion'
    runs-on: self-hosted
    outputs:
      worker_pid: ${{ steps.deploy.outputs.worker_pid }}
    concurrency:
      group: recognition-fusion-deploy
      cancel-in-progress: false

    steps:
      - name: Deploy validated commit to Pop!_OS
        id: deploy
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -e
          export PATH=$PATH:/usr/local/bin:/usr/bin:/bin
          cd /home/popos/projek-anakmagang/ai-recognition

          git fetch origin feat/recognition-fusion
          git reset --hard "$DEPLOY_SHA"

          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

          # Verify the same MinIO credentials used by the worker can write and
          # read an object before restarting the live recognition process.
          .venv/bin/python check_minio_upload.py smoke

          mkdir -p logs
          # GitHub runner kills child processes carrying its tracking ID when
          # the job ends. Keep the PM2-managed services outside that cleanup.
          export RUNNER_TRACKING_ID=""
          if ! pm2 startOrReload ecosystem.config.js --update-env; then
            echo 'PM2 gagal menjalankan Fusion.'
            exit 1
          fi

          # recognition.py fails closed if InsightFace cannot start with CUDA.
          sleep 20
          pm2 jlist | python3 -c 'import json,sys; apps={a["name"]:a["pm2_env"]["status"] for a in json.load(sys.stdin)}; failed=[n for n in ("ai-mobile-api","ai-recognition-worker") if apps.get(n)!="online"]; print("PM2 health check:", apps); sys.exit("PM2 worker tidak online: "+", ".join(failed) if failed else 0)'
          pm2 save
          worker_pid=$(pm2 pid ai-recognition-worker)
          test "$worker_pid" -gt 0
          echo "worker_pid=$worker_pid" >> "$GITHUB_OUTPUT"

  verify_fusion:
    name: Verify Fusion survives runner cleanup
    needs: deploy_fusion
    runs-on: self-hosted
    steps:
      - name: Confirm worker PID remains online after previous job ends
        env:
          EXPECTED_WORKER_PID: ${{ needs.deploy_fusion.outputs.worker_pid }}
        run: |
          set -e
          sleep 5
          actual_worker_pid=$(pm2 pid ai-recognition-worker)
          if [ "$actual_worker_pid" != "$EXPECTED_WORKER_PID" ]; then
            echo "Fusion worker restarted after deploy: $EXPECTED_WORKER_PID -> $actual_worker_pid"
            exit 1
          fi
          kill -0 "$actual_worker_pid"
          pm2 jlist | python3 -c 'import json,sys; apps={a["name"]:a["pm2_env"]["status"] for a in json.load(sys.stdin)}; sys.exit(0 if apps.get("ai-recognition-worker")=="online" else 1)'
          echo "Fusion worker stayed online after runner cleanup (PID $actual_worker_pid)."
