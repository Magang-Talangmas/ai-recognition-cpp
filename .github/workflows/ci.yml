name: CI — AI Stream

on:
  pull_request:
    branches: [stream]
  push:
    branches: [stream]

permissions:
  contents: read

jobs:
  validate:
    name: Validate stream control plane
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Check Python syntax
        run: python -m compileall -q -x '(venv|\\.venv|__pycache__)' .

      - name: Resolve Python dependencies
        run: python -m pip install --dry-run -r requirements.txt

      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose config -q
