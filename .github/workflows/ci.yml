name: CI/CD — AI Stream

on:
  pull_request:
    branches: [stream]
  push:
    branches: [stream]

permissions:
  contents: read

jobs:
  validate:
    name: Validate stream control plane
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Check Python syntax
        run: python -m compileall -q -x '(venv|\.venv|__pycache__)' .

      - name: Resolve Python dependencies
        run: python -m pip install --dry-run -r requirements.txt

      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose config -q

  deploy:
    name: Deploy to Pop!_OS Server
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/stream'
    runs-on: [self-hosted, linux, x64, ai-server]
    steps:
      - name: Deploy Stream
        run: |
          set -e
          export PATH=$PATH:/usr/local/bin:/usr/bin:/bin
          
          echo "=========================================================="
          echo "  Deploying Branch: stream"
          echo "=========================================================="
          echo "  Hostname: $(hostname)"
          echo "  Directory: $(pwd)"
          
          echo "[1/4] Masuk ke direktori dan sinkronisasi Git..."
          cd /home/popos/projek-anakmagang/ai-stream
          git fetch origin stream
          git reset --hard origin/stream
          
          echo "  Commit GitHub yang memicu pipeline: $GITHUB_SHA"
          echo "  Commit Server saat ini: $(git rev-parse HEAD)"
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "ERROR: Commit di server tidak cocok dengan GitHub SHA!"
            exit 1
          fi

          echo "[2/4] Menyiapkan Python environment..."
          if [ ! -x .venv/bin/python ]; then
            python3 -m venv .venv
          fi
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

          echo "[3/4] Menjalankan PM2 media_control_plane..."
          pm2 startOrRestart ecosystem.config.js --env production
          pm2 save

          echo "[4/4] Menjalankan Health Check API Control Plane..."
          sleep 3
          response="$(curl -fsS --retry 5 --retry-delay 1 http://127.0.0.1:8011/)"
          echo "Response: $response"
          echo "$response" | grep -q '"status":"Media Server Control Plane is Running"'
          
          echo "=========================================================="
          echo "  Deployment Selesai dengan Sukses!"
          echo "  Control Plane berjalan dengan sehat di port 8011."
          echo "=========================================================="
