# ==============================================================================
# 🚨 PERINGATAN KERAS UNTUK TIM DEVOPS / SERVER 🚨
# FILE INI HANYA UNTUK DEVELOPMENT LOKAL!
# ==============================================================================
# Di server production, MediaMTX DIKELOLA OLEH docker-compose.yml UTAMA
# (/home/popos/projek-anakmagang/docker-compose.yml).
# DILARANG KERAS menjalankan `docker compose up -d` di branch `stream` ini 
# di production karena akan menyebabkan port bentrok (1935, 8554, dkk)
# dan duplikasi container pengelola MediaMTX!
# ==============================================================================
services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    ports:
      - "8554:8554" # RTSP
      - "1935:1935" # RTMP
      - "8888:8888" # HLS
      - "8889:8889" # WebRTC HTTP
      - "8189:8189/udp" # WebRTC ICE UDP
      - "8189:8189/tcp" # WebRTC ICE TCP
      - "9997:9997" # MediaMTX API
    environment:
      - MTX_API=yes
      - MTX_AUTHINTERNALUSERS_0_USER=any
      - MTX_AUTHINTERNALUSERS_0_PERMISSIONS_0_ACTION=publish
      - MTX_AUTHINTERNALUSERS_0_PERMISSIONS_1_ACTION=read
      - MTX_AUTHINTERNALUSERS_0_PERMISSIONS_2_ACTION=api
      - MTX_PROTOCOLS=tcp
      - MTX_WEBRTCADDITIONALHOSTS=192.168.77.171
      - MTX_WEBRTCALLOWORIGIN=*
      - MTX_HLSALLOWORIGIN=*
      - MTX_APIALLOWORIGIN=*
      
      # --- CCTV RTSP Proxy ---
      - MTX_PATHS_CCTV1_SOURCE=${CCTV1_RTSP_URL}
      - MTX_PATHS_CCTV1_SOURCEONDEMAND=yes
    restart: unless-stopped
